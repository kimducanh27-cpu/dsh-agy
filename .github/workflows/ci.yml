name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Parse YAML
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          files = [
              "cordis.patch.yml",
              "provider/cordis.patch.yml",
              "test/fixtures/antigravity-default-model.yml",
              ".github/workflows/ci.yml",
              ".github/workflows/release.yml",
          ]
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          print(f"yaml ok: {len(files)} files")
          PY
      - name: Secret scan
        shell: bash
        run: |
          set -e
          if git grep -nE "ya29\.[A-Za-z0-9_-]{20,}|1//[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC )?PRIVATE KEY" -- . ; then
            echo "potential secret found"
            exit 1
          fi
          if git ls-files | grep -E "(^|/)antigravity-oauth\.json$|(^|/)\.env$" ; then
            echo "secret-bearing file is tracked"
            exit 1
          fi
          echo "secret scan ok"
      - name: Provider loads against dsh-llm@next
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/check-provider-load.mjs